<div class="card">
  <h1>Restablecer contraseña</h1>

  <p class="intro" *ngIf="paso==='solicitar'">
    Ingresa tu correo y te enviaremos un código de verificación (válido por 15 minutos).
  </p>
  <p class="intro" *ngIf="paso==='restablecer'">
    Revisa tu correo, ingresa el código y define tu nueva contraseña.
  </p>

  <!-- Paso 1: solicitar código -->
  <form *ngIf="paso==='solicitar'" [formGroup]="solicitarForm" (ngSubmit)="solicitar()" class="form">
    <label>Correo electrónico</label>
    <input type="email" formControlName="email" placeholder="tucorreo@ejemplo.com" />
    <button class="btn-gradient btn-center-sm" type="submit" [disabled]="cargando">
      {{ cargando ? 'Enviando…' : 'Enviar código' }}
    </button>
    <button class="link center" type="button" (click)="volverLogin()">Volver al login</button>
  </form>

  <!-- Paso 2: restablecer contraseña -->
  <form *ngIf="paso==='restablecer'" [formGroup]="restablecerForm" (ngSubmit)="restablecer()" class="form">
    <!-- Contador -->
    <div class="timer" [class.expired]="expirado">
      <ng-container *ngIf="!expirado; else expiradoTpl">
        Código válido por: <strong>{{ mm }}:{{ ss }}</strong>
      </ng-container>
      <ng-template #expiradoTpl>
        Código expirado.
        <button type="button" class="link inline" (click)="reenviar()" [disabled]="cargando">Reenviar código</button>
      </ng-template>
    </div>

    <label>Correo</label>
    <input type="email" formControlName="email" />

    <label>Código de verificación</label>
    <input type="text" formControlName="code" placeholder="Código recibido" />

    <label>Nueva contraseña</label>
    <input type="password" formControlName="newPassword" placeholder="********" />

    <label>Confirmar contraseña</label>
    <input type="password" formControlName="confirm" placeholder="********" />

    <button class="btn-gradient btn-center-sm" type="submit" [disabled]="cargando || expirado">
      {{ cargando ? 'Actualizando…' : 'Restablecer' }}
    </button>
    <button class="link center" type="button" (click)="volverLogin()">Volver al login</button>
  </form>
</div>
